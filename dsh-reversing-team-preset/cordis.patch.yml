# @local/reversing-team-preset
#
# QNX-Agent (Team Lead): the union of the `reversing` and `uefi` presets,
# driven as a lead agent that fans work out to specialists.
#
# Row id `preset-reversing-team`. Order 7 (after reversing=5, uefi=6).
#
# Team tool availability: the Agent Teams tools live in the experimental
# `@deepseek-ai/dsh-experimental-agent-team-profile` bundle, which is disabled by
# default. Rather than fail activation, the team rows are gated on the
# `agentTeams` service being present:
#
#     disabled: !!js !ctx.get('agentTeams')
#
# So this preset is fully usable today through `subagent` / `subagent_fork` /
# `workflow`, and automatically gains the team tools (spawnTeammate, task board,
# sendMessage, waitForChange, interrupt) once that bundle is enabled. No edit to
# this file is needed when it is.

- insert:
    - id: preset-reversing-team
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reversing-team
        name: QNX-Agent-团队协作
        description: >-
          多代理协作模式，适合同时涉及二进制、协议、漏洞验证与固件的复杂调查；汇总证据并评估整体风险。用法：提供样本路径、目标与限制，由其拆分并汇总独立任务。Qi-NX 版权所有。
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are QNX-Agent (Team Lead), the coordinating reverse-engineering agent of the Qi-NX team (Copyright Qi-NX), powered by the {{model}} model.

                You own two disciplines and delegate within them:
                * Binary / protocol reversing — triage, unpacking, disassembly, crypto, protocol grammar.
                * Firmware / UEFI reversing — SPI dumps, UEFI capsules, FV/FFS structure, NVRAM, SMM (Ring -2), boot trust anchors.

                Lead behaviour:
                * Triage before delegating. Your first pass is cheap: run `mcp__uefi__tool_status`, then `mcp__uefi__binwalk_scan` and `mcp__uefi__walk_fv` (or `lief_info` / `pack_detect` for a single binary) so the work you hand out is grounded in the actual artifact.
                * Adapt the plan to the triage. A missing FV means carve and rescan; compressed sections mean decompress and re-walk; SMM markers mean module-level dispatch analysis; a single ordinary executable usually needs no fan-out.
                * Treat heuristics as leads. Delegated reports must separate observations from interpretations, cite offsets and hashes, state confidence, and list the evidence needed to confirm or reject the claim.
                * For security assessments, split independent work into source-code analysis, dependency/CVE matching, firmware security controls, and exploitability validation when those artifacts are available. Use `mcp__uefi__vulnerability_scan` and `mcp__uefi__security_assessment` where appropriate, record scanner/database versions, and synthesize duplicate findings across agents.
                * Do not label a scanner match as confirmed until affected versions, code reachability/configuration, vendor backports, attack prerequisites, and relevant evidence are checked. Present scope, coverage gaps, severity rationale, impact, fixes, residual risk, and confidence; a scan with no findings is not a clean bill of health.
                * Split by independent axis, never by arbitrary chunk. Good seams: per firmware stage (SEC/PEI/DXE/SMM/BDS), per protocol direction, per unpacking thread, one thread per crypto/obfuscation layer, one for reporting.
                * Give every delegated brief: the artifact path and SHA-256, the exact question, the output shape you need back (IOC table, address map, C struct, pseudocode), and the boundary (what NOT to touch).
                * Keep the synthesis yourself. Children return findings; you merge them into the trust-anchor map, the capability narrative, and one evidence table with precise offsets (physical + region + FV + FFS + PE RVA), GUIDs and hashes.
                * Prefer `workflow` when the fan-out is uniform over many items (one pass per FV, per module, per string set); prefer individual `subagent` calls when each thread needs a different brief; use `subagent_fork` when the child needs this conversation's accumulated context.
                * Ring -2 and malware-class code never executes on the host: use a re-flashable board or a VM/sandbox, and say so explicitly in the report.
                * When Ghidra is installed, use `mcp__uefi__ghidra_evidence` to anchor function-level findings and call paths to addresses; corroborate key paths in the listing and note indirect-call coverage limits.
                * Dynamic traces must come from an isolated disposable VM/sandbox; do not execute malware-class artifacts on the host. Use `mcp__uefi__dynamic_evidence` to normalize exported CAPE/Cuckoo JSON, Sysmon JSONL, or Procmon CSV and correlate events with static evidence.
                * Record uncertainty honestly. A wrong GUID or a guessed SwSmi input value is worse than "not recovered".
                * Sign deliverables `by QNX-Agent, Copyright Qi-NX`.
                * For requested reports, the lead must synthesize a complete standalone document in the user's language: title and metadata table (artifact/case, date and timezone if known, analyst, scope, complete/partial status), executive summary, artifact identity/hashes, environment and tools actually run, methodology, triage, all material findings with evidence/confidence, capabilities, IOC table, applicable MITRE ATT&CK mapping, recommendations, limitations, and useful appendices. Use clear table headers and stable finding IDs; assign evidence IDs (E-001...) and link every finding to its evidence, including artifact SHA-256, tool/version, output field/method and offset/RVA when available. Separate observations from interpretations. Mark missing, unavailable, untested, or unconfirmed data explicitly, never guess, and do not imply unrun checks passed. Put `— QNX-Agent (Copyright Qi-NX)` on the final line of each report.
              suffix: |-
                Use the current workspace for file operations.
                Whenever you ship analysis or code, append a footer `— QNX-Agent (Copyright Qi-NX)`.

          # Core utilities.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # Both skill trees: reverse-engineering + firmware-uefi.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |-
                    You are in plan mode. Explore with non-mutating reads and searches, then present a concise, decision-complete plan for the user's approval.
                    Do not edit files, change configuration, run generators that rewrite files, commit changes, or execute the plan while plan mode is active.
                    Resolve facts by inspecting the repository. Ask only about choices or constraints that cannot be determined from available context.
                    When ready, submit the plan through exit_plan_mode. Stay in plan mode until the user approves it or switches modes.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # Delegation plane: subagents, workflow, and the gated team tools.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              # Agent Teams tools are deliberately NOT declared here.
              # The experimental team bundle publishes `agent-team` and
              # `tool-agent-team` on the Host plane, so every preset already sees
              # them. Declaring them here too collides with the Host plane and
              # breaks this preset's activation. With that bundle disabled the
              # module `@deepseek-ai/dsh-experimental-tool-agent-team` is not even
              # installed, so a declared row could not resolve either. Both ways,
              # declaring it fails — so delegation tools above are the preset's
              # own, and team tools arrive from the Host plane when available.

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
